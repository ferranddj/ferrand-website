<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ferrand — SoundCloud Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    gap: 20px;
  }

  .info {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .banner-wrap {
    width: 2480px;
    height: 520px;
    position: relative;
    overflow: hidden;
    transform-origin: top left;
    transform: scale(0.4);
    margin-bottom: -312px;
  }

  /* Club foto als Hintergrund */
  .bg-club {
    position: absolute;
    inset: 0;
    background-image: url('images/image_002.jpg');
    background-size: cover;
    background-position: center 30%;
    width: 100%;
    height: 100%;
  }

  /* Dunkles Overlay über Club-Foto */
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 5, 0.35);
  }

  /* Portrait links */
  .portrait {
    position: absolute;
    left: 0;
    top: 0;
    width: 680px;
    height: 520px;
    background-image: url('images/image_004.jpg');
    background-size: cover;
    background-position: center top;
  }

  /* Verlauf über Portrait nach rechts */
  .portrait-fade {
    position: absolute;
    left: 0;
    top: 0;
    width: 780px;
    height: 520px;
    background: linear-gradient(to right,
      rgba(5,5,5,0) 0%,
      rgba(5,5,5,0) 30%,
      rgba(5,5,5,0.6) 60%,
      rgba(5,5,5,0.92) 80%,
      rgba(5,5,5,1) 100%
    );
  }

  /* Verlauf links vom Club-Foto */
  .club-fade-left {
    position: absolute;
    left: 500px;
    top: 0;
    width: 600px;
    height: 520px;
    background: linear-gradient(to right,
      rgba(5,5,5,1) 0%,
      rgba(5,5,5,0.6) 30%,
      rgba(5,5,5,0) 100%
    );
  }

  /* Rechter Rand abdunkeln */
  .right-fade {
    position: absolute;
    right: 0;
    top: 0;
    width: 400px;
    height: 520px;
    background: linear-gradient(to left, rgba(5,5,5,0.7) 0%, transparent 100%);
  }

  /* Top/Bottom Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, transparent 30%, transparent 70%, rgba(5,5,5,0.4) 100%);
  }

  /* Dünne rote Linie */
  .red-line {
    position: absolute;
    left: 740px;
    top: 100px;
    width: 1px;
    height: 320px;
    background: #DA0C1A;
    opacity: 0.5;
  }

  /* Text */
  .text-block {
    position: absolute;
    left: 770px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
  }

  .name {
    font-family: 'Bebas Neue', 'Arial Black', sans-serif;
    font-size: 160px;
    color: #f0ede8;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .role {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 32px;
    color: #DA0C1A;
    letter-spacing: 18px;
    font-weight: 300;
    margin-bottom: 20px;
  }

  .divider {
    width: 800px;
    height: 0.5px;
    background: rgba(240,237,232,0.15);
    margin-bottom: 20px;
  }

  .genres {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 22px;
    color: rgba(240,237,232,0.3);
    letter-spacing: 12px;
    font-weight: 300;
  }

  /* Grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .hint {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.8;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<p class="info">Ferrand — SoundCloud Banner · 2480 × 520px</p>

<div class="banner-wrap">
  <div class="bg-club"></div>
  <div class="bg-overlay"></div>
  <div class="portrait"></div>
  <div class="portrait-fade"></div>
  <div class="club-fade-left"></div>
  <div class="right-fade"></div>
  <div class="vignette"></div>
  <div class="red-line"></div>
  <div class="text-block">
    <div class="name">FERRAND</div>
    <div class="role">DJ · PRODUCER</div>
    <div class="divider"></div>
    <div class="genres">TRANCE · HARD HOUSE · HARD DANCE</div>
  </div>
  <div class="grain"></div>
</div>

<p class="hint">
  Lade diese Datei in deinen GitHub-Ordner hoch (neben index.html)<br>
  Dann im Browser öffnen → Screenshot machen → als JPG speichern
</p>

</body>
</html>
