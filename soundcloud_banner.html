<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ferrand — SoundCloud Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
  }

  .info {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-family: sans-serif;
  }

  .scale-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .banner {
    width: 2480px;
    height: 520px;
    position: relative;
    overflow: hidden;
    transform: scale(0.5);
    transform-origin: center center;
    flex-shrink: 0;
  }

  .bg-club {
    position: absolute;
    inset: 0;
    background-image: url('images/image_002.jpg');
    background-size: cover;
    background-position: center 30%;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,5,5,0.3);
  }

  .portrait {
    position: absolute;
    left: 0;
    top: 0;
    width: 720px;
    height: 520px;
    background-image: url('images/image_004.jpg');
    background-size: cover;
    background-position: center top;
  }

  .portrait-fade {
    position: absolute;
    left: 0;
    top: 0;
    width: 820px;
    height: 520px;
    background: linear-gradient(to right,
      rgba(5,5,5,0) 0%,
      rgba(5,5,5,0) 35%,
      rgba(5,5,5,0.7) 65%,
      rgba(5,5,5,1) 100%
    );
  }

  .right-fade {
    position: absolute;
    right: 0;
    top: 0;
    width: 300px;
    height: 520px;
    background: linear-gradient(to left, rgba(5,5,5,0.6) 0%, transparent 100%);
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(5,5,5,0.35) 0%,
      transparent 25%,
      transparent 75%,
      rgba(5,5,5,0.35) 100%
    );
  }

  .red-line {
    position: absolute;
    left: 790px;
    top: 110px;
    width: 1px;
    height: 300px;
    background: #DA0C1A;
    opacity: 0.5;
  }

  .text-block {
    position: absolute;
    left: 830px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
  }

  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 155px;
    color: #f0ede8;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 14px;
  }

  .role {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    color: #DA0C1A;
    letter-spacing: 18px;
    font-weight: 300;
    margin-bottom: 18px;
  }

  .divider {
    width: 750px;
    height: 0.5px;
    background: rgba(240,237,232,0.12);
    margin-bottom: 18px;
  }

  .genres {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    color: rgba(240,237,232,0.28);
    letter-spacing: 12px;
    font-weight: 300;
  }

  .hint {
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-align: center;
    line-height: 2;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<p class="info">Ferrand — SoundCloud Banner · 2480 × 520px (50% Vorschau)</p>

<div class="scale-wrap">
  <div class="banner">
    <div class="bg-club"></div>
    <div class="bg-overlay"></div>
    <div class="portrait"></div>
    <div class="portrait-fade"></div>
    <div class="right-fade"></div>
    <div class="vignette"></div>
    <div class="red-line"></div>
    <div class="text-block">
      <div class="name">FERRAND</div>
      <div class="role">DJ · PRODUCER</div>
      <div class="divider"></div>
      <div class="genres">TRANCE · HARD HOUSE · HARD DANCE</div>
    </div>
  </div>
</div>

<p class="hint">
  Screenshot machen → als JPG speichern → auf SoundCloud hochladen<br>
  Tipp: Browser-Zoom auf 100% setzen vor dem Screenshot
</p>

</body>
</html>
