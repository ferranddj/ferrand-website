<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ferrand — SoundCloud Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
  }

  .scale-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .banner {
    width: 2480px;
    height: 520px;
    position: relative;
    overflow: hidden;
    transform: scale(0.5);
    transform-origin: center center;
    flex-shrink: 0;
  }

  /* Club foto rechts als Hintergrund */
  .bg-club {
    position: absolute;
    inset: 0;
    background-image: url('images/image_002.jpg');
    background-size: cover;
    background-position: center 30%;
  }

  /* Portrait links */
  .portrait {
    position: absolute;
    left: 0;
    top: 0;
    width: 900px;
    height: 520px;
    background-image: url('images/image_004.jpg');
    background-size: cover;
    background-position: center top;
  }

  /* Weicher Übergang Portrait → Club */
  .blend {
    position: absolute;
    left: 400px;
    top: 0;
    width: 700px;
    height: 520px;
    background: linear-gradient(to right,
      rgba(5,5,5,0) 0%,
      rgba(5,5,5,0.4) 40%,
      rgba(5,5,5,0.85) 70%,
      rgba(5,5,5,1) 100%
    );
  }

  /* Links Club abdunkeln für nahtlosen Übergang */
  .club-blend {
    position: absolute;
    left: 900px;
    top: 0;
    width: 500px;
    height: 520px;
    background: linear-gradient(to right,
      rgba(5,5,5,1) 0%,
      rgba(5,5,5,0.5) 40%,
      rgba(5,5,5,0) 100%
    );
  }

  /* Rechter Rand */
  .right-fade {
    position: absolute;
    right: 0;
    top: 0;
    width: 250px;
    height: 520px;
    background: linear-gradient(to left, rgba(5,5,5,0.5) 0%, transparent 100%);
  }

  /* Top/Bottom Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(5,5,5,0.3) 0%,
      transparent 20%,
      transparent 80%,
      rgba(5,5,5,0.3) 100%
    );
  }

  .hint {
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-align: center;
    line-height: 2;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<div class="scale-wrap">
  <div class="banner">
    <div class="bg-club"></div>
    <div class="portrait"></div>
    <div class="blend"></div>
    <div class="club-blend"></div>
    <div class="right-fade"></div>
    <div class="vignette"></div>
  </div>
</div>

<p class="hint">Screenshot machen → als JPG speichern → auf SoundCloud hochladen</p>

</body>
</html>
