<title>Ferrand — Hero Podest Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --void:        #060608;
    --void-lift:   #0d0d11;   /* leicht angehobene Mitte für Tiefe */
    --chrome:      #dfe3e8;
    --micro:       #6d7078;   /* gedämpfte Mikrotypo */
    --micro-dim:   #44464c;
  }

  html, body { background: var(--void); color: var(--chrome);
    font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ============ HERO ============ */
  #hero {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    /* CSS-Tiefe: radialer Lift in der Mitte, der NAHTLOS in die Bildränder übergeht.
       Dadurch verschwindet die Bildkante komplett — egal welches Seitenverhältnis. */
    background:
      radial-gradient(ellipse 60% 50% at 50% 46%,
        var(--void-lift) 0%,
        var(--void) 60%,
        #000 100%);
  }
