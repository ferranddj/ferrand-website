<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mini Test</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  body { background:#111; color:#eee; font-family:monospace; padding:20px; }
  model-viewer { width:100%; height:400px; background:#222; border:2px solid #555; display:block; }
  #log { margin-top:16px; font-size:13px; line-height:1.7; }
  .ok  { color:#4ade80; }
  .bad { color:#f87171; }
  .wait{ color:#fbbf24; }
</style>
</head>
<body>

<h2>Mini-Test: model-viewer + GLB</h2>

<model-viewer id="mv"
  src="models/dragonfly-v2.glb"
  alt="Test"
  camera-controls
  auto-rotate
  environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k.hdr">
</model-viewer>

<div id="log">
  <div id="s1" class="wait">1. model-viewer Script … wird geprüft</div>
  <div id="s2" class="wait">2. GLB-Datei … wird geprüft</div>
  <div id="s3" class="wait">3. Modell laden … wird geprüft</div>
  <div id="s4" class="wait">4. WebGL … wird geprüft</div>
</div>

<script>
function set(id, ok, txt){
  const el = document.getElementById(id);
  el.className = ok ? 'ok' : 'bad';
  el.textContent = (ok ? '✅ ' : '❌ ') + txt;
}

// 4. WebGL support
try {
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2') || c.getContext('webgl');
  set('s4', !!gl, '4. WebGL: ' + (gl ? 'verfügbar' : 'NICHT verfügbar — 3D kann nicht dargestellt werden'));
} catch(e) {
  set('s4', false, '4. WebGL: Fehler — ' + e.message);
}

// 2. Can we fetch the GLB?
fetch('models/dragonfly-v2.glb', { method: 'HEAD' })
  .then(r => set('s2', r.ok, '2. GLB-Datei: HTTP ' + r.status + (r.ok ? ' — gefunden' : ' — NICHT gefunden')))
  .catch(e => set('s2', false, '2. GLB-Datei: Fehler — ' + e.message));

// 1. Did the custom element get defined?
customElements.whenDefined('model-viewer')
  .then(() => set('s1', true, '1. model-viewer Script: geladen (selbst gehostet)'));
setTimeout(() => {
  if (!customElements.get('model-viewer')) {
    fetch('model-viewer.min.js', { method: 'HEAD' })
      .then(r => set('s1', false, '1. model-viewer Script: nicht aktiv — Datei HTTP ' + r.status +
        (r.ok ? ' (Datei da, aber Script lief nicht)' : ' (Datei fehlt im Ordner)')))
      .catch(e => set('s1', false, '1. model-viewer Script: Datei nicht erreichbar — ' + e.message));
  }
}, 6000);

// 3. Model load events
const mv = document.getElementById('mv');
mv.addEventListener('load',  () => set('s3', true,  '3. Modell laden: erfolgreich gerendert'));
mv.addEventListener('error', e => {
  const d = e.detail || {};
  const inner = d.sourceError ? (d.sourceError.message || String(d.sourceError)) : '';
  set('s3', false, '3. Modell laden: FEHLER — ' + (d.type || '?') +
      (inner ? ' :: ' + inner : ' :: (kein Detail)'));
  console.error('model-viewer error detail:', d, d.sourceError);
});
setTimeout(() => {
  const el = document.getElementById('s3');
  if (el.className === 'wait') set('s3', false, '3. Modell laden: Timeout — kein load/error Event nach 15s');
}, 15000);

// 5. Read the first bytes of the GLB — proves WHICH file the server actually sends
fetch('models/dragonfly-v2.glb')
  .then(r => r.arrayBuffer())
  .then(buf => {
    const v = new DataView(buf);
    const magic = String.fromCharCode(v.getUint8(0), v.getUint8(1), v.getUint8(2), v.getUint8(3));
    const jsonLen = v.getUint32(12, true);
    const json = new TextDecoder().decode(new Uint8Array(buf, 20, Math.min(jsonLen, 4000)));
    const hasMeshopt = json.includes('EXT_meshopt_compression');
    const el = document.createElement('div');
    el.className = hasMeshopt ? 'bad' : 'ok';
    el.textContent = (hasMeshopt ? '❌ ' : '✅ ') +
      '5. Gelieferte Datei: ' + (buf.byteLength/1024).toFixed(0) + ' KB, magic="' + magic + '", meshopt=' +
      (hasMeshopt ? 'JA (alte Datei aus dem Cache!)' : 'nein (richtige Datei)');
    document.getElementById('log').appendChild(el);
  })
  .catch(e => {
    const el = document.createElement('div');
    el.className = 'bad';
    el.textContent = '❌ 5. Gelieferte Datei: Fehler — ' + e.message;
    document.getElementById('log').appendChild(el);
  });
</script>

</body>
</html>
